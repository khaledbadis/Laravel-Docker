# Use this file alone; never merge it with compose.yaml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-app:${RELEASE_SHA:?Set a full commit SHA}
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      APP_NAME: "Little list"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set a stable APP_KEY}
      APP_URL: ${APP_URL:?Set the HTTPS URL}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      MAIL_MAILER: log
    volumes:
      - app_data:/var/www/html/storage/app
    tmpfs:
      - /tmp
      - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0770
      - /var/www/html/storage/framework:uid=33,gid=33,mode=0770
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/app-health.php"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging
    networks: [backend]

  web:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}-web:${RELEASE_SHA:?Set a full commit SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
    networks: [backend]

  db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *logging
    networks: [backend]

volumes:
  postgres_data:
  app_data:

networks:
  backend:
    driver: bridge
