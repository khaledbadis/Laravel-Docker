# Development only. Production will use a separate, explicit Compose file.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Copy .env.example to .env first}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  db_test:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    profiles: ["testing"]
    environment:
      POSTGRES_DB: todo_test
      POSTGRES_USER: todo_test
      POSTGRES_PASSWORD: local-testing-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "todo_test", "-d", "todo_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - backend

  web:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend

  node:
    image: node:24-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553
    profiles: ["frontend"]
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    # Run Vite directly so it receives SIGTERM and removes public/hot on stop.
    command: ["node", "node_modules/vite/bin/vite.js"]
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
